name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  CI: "true"

jobs:
  build-and-test:
    name: Compilación, pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore sensus-back.sln

      - name: Compilar
        run: dotnet build sensus-back.sln --configuration Release --no-restore

      - name: Verificar formato
        run: dotnet format sensus-back.sln --verify-no-changes --no-restore

      - name: Pruebas unitarias y de arquitectura
        run: >
          dotnet test sensus-back.sln
          --configuration Release
          --no-build
          --filter "FullyQualifiedName!~Integration"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/coverage
          --logger "trx;LogFileName=results.trx"
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=./artifacts/coverage/

      - name: Umbral de cobertura (Domain y Application ≥ 80 %)
        run: node .github/scripts/check-coverage.mjs artifacts/coverage 80 Sensus.Domain Sensus.Application

      - name: Puerta bloqueante de Evals deterministas de Sensi IA (FR-047-13, NFR-047-06)
        run: |
          node --test .github/scripts/run-ai-evals.test.mjs .github/scripts/post-deploy-smoke.test.mjs
          node .github/scripts/run-ai-evals.mjs --mode deterministic

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: ./artifacts/coverage
          retention-days: 14

  integration-tests:
    name: Pruebas de integración (MongoDB real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7.0@sha256:884c055bff8b7144ca44830d01826facd3083b33c4dea44b94a1476c62de3c32
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      dynamodb:
        image: amazon/dynamodb-local:2.6.1@sha256:1856c05cc66a0e49dc1099e483ad2851477eeebe2135250ac11a1d1227db54b1
        ports:
          - 8000:8000

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore sensus-back.sln

      - name: Compilar
        run: dotnet build sensus-back.sln --configuration Release --no-restore

      - name: Pruebas de integración (Testcontainers + MongoDB real)
        run: >
          dotnet test tests/Sensus.IntegrationTests/Sensus.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration.trx"
        env:
          MONGO_CONNECTION_STRING: mongodb://localhost:27017
          DYNAMODB_LOCAL_ENDPOINT: http://localhost:8000

      - name: Publicar resultados de integración
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-results
          path: ./artifacts/integration
          retention-days: 14

  snyk-security:
    name: Seguridad de dependencias y código (Snyk)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Instalar Snyk CLI
        run: npm install -g --ignore-scripts snyk@1.1308.4

      - name: Autenticar Snyk
        run: snyk auth ${SNYK_TOKEN}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Restaurar dependencias
        run: dotnet restore sensus-back.sln

      - name: Snyk test dependencias (bloqueante)
        run: snyk test --severity-threshold=high --all-projects

      - name: Snyk monitor (registro de dependencias)
        if: github.event_name == 'push'
        run: snyk monitor --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  mutation-testing:
    name: Pruebas de mutación (Stryker.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore sensus-back.sln

      - name: Compilar
        run: dotnet build sensus-back.sln --configuration Release --no-restore

      - name: Instalar dotnet-stryker
        run: dotnet tool install --global dotnet-stryker

      - name: Ejecutar pruebas de mutación (advisory, no bloquea)
        run: dotnet stryker --project tests/Sensus.Application.UnitTests/Sensus.Application.UnitTests.csproj --open-report never
        continue-on-error: true

  sonarcloud:
    name: Calidad de código (SonarCloud)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-test, integration-tests, mutation-testing]
    # SonarQube Cloud (plan gratuito, P-VI) solo permite análisis de rama en `main`
    # y análisis de Pull Requests (incluidos los PR hacia `develop` y `main`).
    if: success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    services:
      mongo:
        image: mongo:7.0@sha256:884c055bff8b7144ca44830d01826facd3083b33c4dea44b94a1476c62de3c32
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      dynamodb:
        image: amazon/dynamodb-local:2.6.1@sha256:1856c05cc66a0e49dc1099e483ad2851477eeebe2135250ac11a1d1227db54b1
        ports:
          - 8000:8000

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Instalar SonarScanner para .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restaurar
        run: dotnet restore sensus-back.sln

      - name: Iniciar análisis SonarCloud
        id: sonar_begin
        run: >
          dotnet sonarscanner begin
          /k:"sensus-proj_sensus-back"
          /o:"sensus-proj"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.exclusions="**/bin/**,**/obj/**,.github/**,infra/**"
          /d:sonar.coverage.exclusions="**/bin/**,**/obj/**,**/*.Generated*.cs,**/Properties/**,**/Migration/**,**/Migrations/**,**/Program.cs,**/Endpoints/**,**/Persistence/Mongo/**,**/Cache/RedisCacheService.cs,**/Services/CloudinaryImageStorage.cs,**/Services/SesEmailSender.cs,**/Services/NominatimGeocodingService.cs,**/Services/OpenAiImageModerationService.cs,**/Services/OpenAiSettings.cs,**/Services/OfferExpirationBackgroundService.cs,.github/**,infra/**,**/*.mjs,**/*.js"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Compilar
        run: dotnet build sensus-back.sln --configuration Release --no-restore

      - name: Ejecutar pruebas con cobertura OpenCover para SonarCloud
        run: >
          dotnet test sensus-back.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/coverage
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        env:
          MONGO_CONNECTION_STRING: mongodb://localhost:27017
          DYNAMODB_LOCAL_ENDPOINT: http://localhost:8000

      - name: Verificar reportes de cobertura generados
        run: |
          echo "### Reportes OpenCover generados" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find ./artifacts/coverage -name 'coverage.opencover.xml' -ls >> $GITHUB_STEP_SUMMARY
          echo '--- Muestra de rutas en el reporte ---' >> $GITHUB_STEP_SUMMARY
          grep -m 10 '<File ' $(find ./artifacts/coverage -name 'coverage.opencover.xml' | head -n 1) >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Finalizar análisis SonarCloud
        shell: bash
        run: |
          set +e
          set -o pipefail
          dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}" 2>&1 | tee sonar_end.log
          rc=$?
          echo "### Log final SonarScanner" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 sonar_end.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $rc
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: always() && steps.sonar_begin.outcome == 'success'


  quality:
    name: Seguridad de dependencias y secretos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Dependencias vulnerables
        run: |
          dotnet restore sensus-back.sln
          dotnet list sensus-back.sln package --vulnerable --include-transitive

      - name: Escaneo de secretos (bloqueante)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Test de arquitectura
        run: dotnet test tests/Sensus.ArchitectureTests --configuration Release

      - name: Generar SBOM CycloneDX (FR-047-20)
        run: |
          dotnet tool install --global CycloneDX --version 6.3.2
          dotnet CycloneDX sensus-back.sln -j -o artifacts/sbom -fn bom.json

      - name: Publicar artefacto SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-ci-cyclonedx
          path: artifacts/sbom/bom.json
          retention-days: 30

  iac:
    name: Infraestructura como código
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # GitHub no admite el contexto `secrets` en `if:` de un paso; se expone solo un booleano a nivel de job.
    env:
      HAS_IAC_ROLE: ${{ secrets.AWS_IAC_ROLE_ARN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Comprobar existencia de infraestructura
        id: check_infra
        run: |
          if [ -f "infra/cdk.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Directorio infra/cdk.json no encontrado. Pasos de CDK omitidos."
          fi

      - name: Configurar .NET
        if: steps.check_infra.outputs.exists == 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Instalar AWS CDK
        if: steps.check_infra.outputs.exists == 'true'
        run: npm install -g --ignore-scripts aws-cdk@2.1148.0

      - name: cdk synth (incluye cdk-nag AwsSolutionsChecks)
        if: steps.check_infra.outputs.exists == 'true'
        working-directory: infra
        run: cdk synth --quiet

      - name: Autenticar en AWS con OIDC para cdk diff (FR-045-20)
        if: steps.check_infra.outputs.exists == 'true' && github.event_name == 'pull_request' && env.HAS_IAC_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_IAC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

      - name: cdk diff
        if: steps.check_infra.outputs.exists == 'true' && github.event_name == 'pull_request'
        working-directory: infra
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            cdk diff
          elif [ -n "$AWS_SESSION_TOKEN" ]; then
            cdk diff
          else
            echo "Credenciales OIDC/AWS pendientes (AWS_IAC_ROLE_ARN); sintaxis y cdk-nag verificados con cdk synth."
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-2' }}

  sdd:
    name: Trazabilidad SDD
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Toda carpeta de spec MUST tener los cuatro artefactos (constitution.md §3.6).
      - name: Verificar artefactos por spec
        run: node .github/scripts/check-specs.mjs specs
