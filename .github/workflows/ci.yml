name: CI

on:
  push:
    branches: ["main", "Sprint1"]
  pull_request:
    branches: ["main", "Sprint1"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  CI: "true"
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

jobs:
  build-and-test:
    name: Compilación, pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore sensus-back.sln

      - name: Compilar
        run: dotnet build sensus-back.sln --configuration Release --no-restore

      - name: Verificar formato
        run: dotnet format sensus-back.sln --verify-no-changes --no-restore

      - name: Pruebas unitarias y de arquitectura
        run: >
          dotnet test sensus-back.sln
          --configuration Release
          --no-build
          --filter "FullyQualifiedName!~Integration"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/coverage
          --logger "trx;LogFileName=results.trx"
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=./artifacts/coverage/

      - name: Umbral de cobertura (Domain y Application ≥ 80 %)
        run: node .github/scripts/check-coverage.mjs artifacts/coverage 80 Sensus.Domain Sensus.Application

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/coverage
          retention-days: 14

  integration-tests:
    name: Pruebas de integración (MongoDB real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore sensus-back.sln

      - name: Compilar
        run: dotnet build sensus-back.sln --configuration Release --no-restore

      - name: Pruebas de integración (Testcontainers + MongoDB real)
        run: >
          dotnet test tests/Sensus.IntegrationTests/Sensus.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration.trx"
        env:
          MONGO_CONNECTION_STRING: mongodb://localhost:27017

      - name: Publicar resultados de integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: ./artifacts/integration
          retention-days: 14

  snyk-security:
    name: Seguridad de dependencias y código (Snyk)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Instalar Snyk CLI
        run: npm install -g --ignore-scripts snyk@1.1308.4

      - name: Autenticar Snyk
        run: snyk auth ${SNYK_TOKEN}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Restaurar dependencias
        run: dotnet restore sensus-back.sln

      - name: Snyk test dependencias (bloqueante)
        run: snyk test --severity-threshold=high --all-projects

      - name: Snyk monitor (registro de dependencias)
        if: github.event_name == 'push'
        run: snyk monitor --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  mutation-testing:
    name: Pruebas de mutación (Stryker.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore sensus-back.sln

      - name: Compilar
        run: dotnet build sensus-back.sln --configuration Release --no-restore

      - name: Instalar dotnet-stryker
        run: dotnet tool install --global dotnet-stryker

      - name: Ejecutar pruebas de mutación (advisory, no bloquea)
        run: dotnet stryker --project tests/Sensus.Application.UnitTests/Sensus.Application.UnitTests.csproj --open-report never
        continue-on-error: true

  sonarcloud:
    name: Calidad de código (SonarCloud)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-test, integration-tests, mutation-testing]
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Instalar SonarScanner para .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restaurar
        run: dotnet restore sensus-back.sln

      - name: Iniciar análisis SonarCloud
        id: sonar_begin
        run: >
          dotnet sonarscanner begin
          /k:"sensus-proj_sensus-back"
          /o:"sensus-proj"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.exclusions="**/bin/**,**/obj/**,.github/**"
          /d:sonar.coverage.exclusions="**/bin/**,**/obj/**,**/*.Generated*.cs,**/Properties/**,**/Migration/**,**/Migrations/**,**/Program.cs,**/Persistence/Mongo/**,**/Services/CloudinaryImageStorage.cs,**/Services/HttpMailerEmailSender.cs,**/Services/NominatimGeocodingService.cs,.github/**,**/*.mjs,**/*.js"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.qualitygate.wait=true
          /d:sonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Compilar
        run: dotnet build sensus-back.sln --configuration Release --no-restore

      - name: Ejecutar pruebas con cobertura OpenCover para SonarCloud
        run: >
          dotnet test sensus-back.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/coverage
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        env:
          MONGO_CONNECTION_STRING: mongodb://localhost:27017

      - name: Verificar reportes de cobertura generados
        run: |
          echo "### Reportes OpenCover generados" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find ./artifacts/coverage -name 'coverage.opencover.xml' -ls >> $GITHUB_STEP_SUMMARY
          echo '--- Muestra de rutas en el reporte ---' >> $GITHUB_STEP_SUMMARY
          grep -m 10 '<File ' $(find ./artifacts/coverage -name 'coverage.opencover.xml' | head -n 1) >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Finalizar análisis SonarCloud
        shell: bash
        run: |
          set -o pipefail
          dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}" 2>&1 | tee sonar_end.log
          echo "### Log final SonarScanner" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 sonar_end.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: always() && steps.sonar_begin.outcome == 'success'


  quality:
    name: Seguridad de dependencias y secretos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Dependencias vulnerables
        run: |
          dotnet restore sensus-back.sln
          dotnet list sensus-back.sln package --vulnerable --include-transitive

      - name: Escaneo de secretos (bloqueante)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Test de arquitectura
        run: dotnet test tests/Sensus.ArchitectureTests --configuration Release

  iac:
    name: Infraestructura como código
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Comprobar existencia de infraestructura
        id: check_infra
        run: |
          if [ -f "infra/cdk.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Directorio infra/cdk.json no encontrado. Pasos de CDK omitidos."
          fi

      - name: Configurar .NET
        if: steps.check_infra.outputs.exists == 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Instalar AWS CDK
        if: steps.check_infra.outputs.exists == 'true'
        run: npm install -g aws-cdk

      - name: cdk synth
        if: steps.check_infra.outputs.exists == 'true'
        working-directory: infra
        run: cdk synth --quiet

      - name: cdk diff
        if: steps.check_infra.outputs.exists == 'true' && github.event_name == 'pull_request'
        working-directory: infra
        run: cdk diff --fail
        env:
          AWS_REGION: us-east-1

  sdd:
    name: Trazabilidad SDD
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Toda carpeta de spec MUST tener los cuatro artefactos (constitution.md §3.6).
      - name: Verificar artefactos por spec
        run: node .github/scripts/check-specs.mjs specs
