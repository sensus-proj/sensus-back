openapi: 3.1.0
info:
  title: "Sensus API — Spec 053 Comercios cercanos"
  version: 1.0.0
  description: >
    Comercios activos dentro de un radio, ordenados por cercanía (SE-008). Retro-spec del comportamiento en
    producción: hoy devuelve una lista sin paginar con un tope de 50 (brecha FR-053-05).
servers:
  - url: https://localhost:5001
paths:
  /api/v1/merchants/nearby:
    get:
      summary: Comercios cercanos
      operationId: getNearbyMerchants
      security: [{ bearerAuth: [] }]
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - name: radioMetros
          in: query
          required: false
          description: Radio en metros. Por defecto 2000; tope de 2000 para invitados y 50000 para registrados
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Comercios activos ordenados por cercanía (máximo 50)
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: { $ref: '#/components/schemas/Comercio' }
        '401':
          description: Sin token o token inválido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Comercio:
      type: object
      description: Datos públicos del comercio (ComercioDto)
      additionalProperties: true
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
