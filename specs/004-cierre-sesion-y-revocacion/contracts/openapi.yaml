openapi: 3.1.0
info:
  title: "Sensus API — Spec 004 Cierre de sesión y revocación de token"
  version: 1.0.0
  description: "Contrato del spec 004."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/auth/logout:
    post:
      summary: "Cierra la sesión activa revocando el token JWT actual de forma verificable e idempotente"
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: deviceId
          required: false
          description: Identificador de la instalación que se desvincula de las notificaciones push.
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '204': { description: Sin contenido }
        '400': { description: Identificador inválido }
        '401': { description: No autenticado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
