openapi: 3.1.0
info:
  title: "Sensus API — Spec 021 Auditoría de moderación"
  version: 1.1.0
  description: >
    Contrato administrativo para la consulta inmutable y paginada de la evidencia de
    moderación (Spec 021, FR-021-03). Exclusivo para administradores mediante JWT.
servers:
  - url: https://localhost:5001
paths:
  /api/v1/admin/moderation/audit:
    get:
      summary: Consulta paginada e inmutable de las decisiones de moderación
      operationId: getModerationAudit
      tags:
        - "Moderación: auditoría (Spec 021)"
      security:
        - bearerAuth: []
      parameters:
        - name: targetId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Identificador del contenido evaluado (activo, comentario u oferta)
        - name: targetType
          in: query
          required: false
          schema:
            type: string
            enum: [MediaAsset, FeedComment, Offer, StoreReview, Comercio, User]
          description: Tipo de contenido evaluado
        - name: verdict
          in: query
          required: false
          schema:
            type: string
            enum: [Approved, Quarantined, Rejected]
          description: Veredicto de moderación aplicado
        - name: fromUtc
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Fecha y hora inicial del filtro (UTC)
        - name: toUtc
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Fecha y hora final del filtro (UTC)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Número de página (base 1)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Elementos por página (20 por defecto, 100 máximo)
      responses:
        '200':
          description: Listado paginado de evidencias de moderación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultOfModerationAuditRecordDto'
        '400':
          description: Parámetros de consulta inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: No autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Acceso denegado (requiere rol Administrador)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Demasiadas solicitudes (Rate limit excedido)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ModerationAuditRecordDto:
      type: object
      required:
        - id
        - targetId
        - targetType
        - verdict
        - decision
        - contentContext
        - flaggedCategories
        - categoryScores
        - actorType
        - actorId
        - correlationId
        - createdAtUtc
        - retainUntilUtc
      properties:
        id:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
        targetType:
          type: string
          enum: [MediaAsset, FeedComment, Offer, StoreReview, Comercio, User]
        verdict:
          type: string
          enum: [Approved, Quarantined, Rejected]
        decision:
          type: string
        contentContext:
          type: string
        flaggedCategories:
          type: array
          items:
            type: string
        categoryScores:
          type: object
          additionalProperties:
            type: number
            format: double
        thresholdApplied:
          type: string
          nullable: true
        actorType:
          type: string
          enum: [User, System, Administrator]
        actorId:
          type: string
        correlationId:
          type: string
        createdAtUtc:
          type: string
          format: date-time
        retainUntilUtc:
          type: string
          format: date-time
    PagedResultOfModerationAuditRecordDto:
      type: object
      required:
        - items
        - totalCount
        - pageNumber
        - pageSize
        - totalPages
        - hasPreviousPage
        - hasNextPage
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModerationAuditRecordDto'
        totalCount:
          type: integer
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        hasPreviousPage:
          type: boolean
        hasNextPage:
          type: boolean
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
