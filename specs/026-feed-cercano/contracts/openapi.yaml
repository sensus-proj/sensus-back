openapi: 3.1.0
info:
  title: "Sensus API — Spec 026 Feed geolocalizado"
  version: 1.0.0
  description: "Borrador del contrato del spec 026. Completar esquemas antes de implementar."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/feed/nearby:
    get:
      summary: "Borrador de GET /api/v1/feed/nearby"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: radiusKm
          in: query
          description: Radio en kilómetros, con un máximo de 5 km inclusive.
          schema:
            type: number
            maximum: 5
      responses:
        '200': { description: OK }
        '400': { description: Solicitud inválida }
        '401': { description: No autenticado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
