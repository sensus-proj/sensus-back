openapi: 3.1.0
info:
  title: "Sensus API — Spec 038 Favoritos de ofertas"
  version: 2.1.0
  description: "Contrato OpenAPI para alternar el favorito de una oferta por el usuario autenticado (Spec 038). La señal de favoritos alimenta la afinidad de la spec 042."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/users/favorites:
    get:
      summary: "Lista paginada de ofertas favoritas vigentes del usuario autenticado"
      operationId: "GetUserFavorites"
      tags:
        - "Favoritos de Usuario (Spec 038)"
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: "Número de página (1-based)"
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: "Tamaño de página (20 por defecto, 100 máximo)"
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: "Página de ofertas favoritas vigentes ordenadas por fecha de guardado descendente"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedFavoriteOfferResponse"
        '400':
          description: "Parámetros de paginación inválidos"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '401':
          description: "No autenticado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '403':
          description: "Usuario invitado o con sanción activa"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/users/favorites/{id}:
    post:
      summary: "Alterna el favorito del usuario autenticado sobre una oferta activa"
      operationId: "ToggleOfferFavorite"
      tags:
        - "Favoritos de Usuario (Spec 038)"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Identificador GUID de la oferta"
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Estado resultante de la alternancia y conteo total"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteToggleResponse"
        '401':
          description: "No autenticado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '403':
          description: "Usuario invitado o con sanción activa"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: "Oferta inexistente, expirada o archivada"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '429':
          description: "Límite de tasa excedido (120 alternancias/hora)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    FavoriteToggleResponse:
      type: object
      required:
        - offerId
        - favorited
        - favoriteCount
      properties:
        offerId:
          type: string
          format: uuid
        favorited:
          type: boolean
          description: "true si la oferta quedó marcada como favorita, false si fue desmarcada"
        favoriteCount:
          type: integer
          minimum: 0
          description: "Conteo total de favoritos que tiene la oferta"

    FavoriteOfferItem:
      type: object
      required:
        - id
        - merchantId
        - merchantName
        - category
        - title
        - originalPrice
        - discountPercentage
        - discountedPrice
        - stock
        - startsAt
        - endsAt
        - favoritedAtUtc
      properties:
        id:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        merchantName:
          type: string
        category:
          type: string
        title:
          type: string
        description:
          type: string
        originalPrice:
          type: number
        discountPercentage:
          type: integer
        discountedPrice:
          type: number
        stock:
          type: integer
        imageUrl:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        likesCount:
          type: integer
        favoritedAtUtc:
          type: string
          format: date-time

    PagedFavoriteOfferResponse:
      type: object
      required:
        - items
        - totalCount
        - pageNumber
        - pageSize
        - totalPages
        - hasPreviousPage
        - hasNextPage
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FavoriteOfferItem"
        totalCount:
          type: integer
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        hasPreviousPage:
          type: boolean
        hasNextPage:
          type: boolean

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
