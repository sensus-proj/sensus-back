openapi: 3.1.0
info:
  title: "Sensus API — Spec 002 Inicio de sesión"
  version: 1.0.0
  description: "Borrador del contrato del spec 002. Completar esquemas antes de implementar."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/auth/login:
    post:
      summary: "Borrador de POST /api/v1/auth/login"
      security: []
      responses:
        '200': { description: OK }
        '400': { description: Solicitud inválida }
  /api/v1/auth/me:
    get:
      summary: Identidad de la sesión actual, leída de los claims del JWT
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Datos de la sesión
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string }
                  nombreCompleto: { type: string }
                  correo: { type: [string, 'null'] }
                  roles: { type: array, items: { type: string } }
        '401':
          description: Sin token, token revocado o usuario sancionado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
