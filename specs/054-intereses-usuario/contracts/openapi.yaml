openapi: 3.1.0
info:
  title: "Sensus API — Spec 054 Intereses del usuario"
  version: 1.0.0
  description: >
    Categorías de interés del usuario registrado, usadas por el feed de promociones (spec 042).
    Selección opcional al registrarse y editable desde el perfil.
servers:
  - url: https://localhost:5001
paths:
  /api/v1/users/me/interests:
    get:
      summary: Consultar mis intereses
      operationId: getMyInterests
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Intereses del usuario (lista vacía si nunca eligió)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserInterests' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    put:
      summary: Reemplazar mis intereses
      operationId: replaceMyInterests
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInterests' }
      responses:
        '200':
          description: Intereses guardados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserInterests' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Error uniforme
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    UserInterests:
      type: object
      required: [categories]
      additionalProperties: false
      properties:
        categories:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            enum: [Grocery, CleaningHome, Perishables, Dairy, Food, Bakery, Beverages, Pets, Pharmacy]
            description: Catálogo de producto OfferCategory (spec 034)
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
