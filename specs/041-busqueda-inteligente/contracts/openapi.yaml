openapi: 3.1.0
info:
  title: "Sensus API — Spec 041 Búsqueda de ofertas"
  version: 1.1.0
  description: "Borrador del contrato del spec 041 (ruta y acceso de invitado decididos el 2026-11-20). Completar esquemas antes de implementar (T041-01)."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/offers/search:
    get:
      summary: "Borrador de GET /api/v1/offers/search"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '400': { description: Solicitud inválida }
        '401': { description: No autenticado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
