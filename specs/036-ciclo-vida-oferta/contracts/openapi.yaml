openapi: 3.1.0
info:
  title: "Sensus API — Spec 036 Ciclo de vida de la oferta"
  version: 1.1.0
  description: "Transiciones Published, Paused, Archived, republicación e invocación administrativa de expiración."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/offers/{id}/status:
    put:
      summary: "Cambiar el estado del ciclo de vida de una oferta propia"
      operationId: changeOfferStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeOfferStatusBody' }
      responses:
        '200':
          description: Oferta actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfferDto' }
        '400':
          description: Estado inválido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401': { description: No autenticado }
        '403': { description: No autorizado o no dueño }
        '404': { description: Oferta no encontrada }
        '409':
          description: Transición inválida o apartados activos al intentar archivar
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /api/v1/offers/{id}/republish:
    post:
      summary: "Republicar una oferta expirada o archivada con nuevas fechas, stock y re-moderación"
      operationId: republishOffer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepublishOfferBody' }
      responses:
        '200':
          description: Oferta republicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfferDto' }
        '400': { description: Fechas/stock inválidos o rechazo de moderación }
        '401': { description: No autenticado }
        '403': { description: No es comerciante dueño }
        '404': { description: Oferta no encontrada }
        '409': { description: No se puede republicar en su estado actual }
        '429': { description: Límite de escritura excedido }
  /api/v1/offers/expire-check:
    post:
      summary: "Expirar ofertas vencidas (solo Administrador)"
      operationId: triggerOfferExpiration
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Conteo de ofertas expiradas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpireOffersResultDto' }
        '401': { description: No autenticado }
        '403': { description: Requiere rol Administrador }
        '429': { description: Límite de escritura excedido }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ChangeOfferStatusBody:
      type: object
      required: [newStatus]
      properties:
        newStatus:
          type: string
          enum: [Published, Paused, Archived]
    RepublishOfferBody:
      type: object
      required: [newStartsAt, newEndsAt, newStock]
      properties:
        newStartsAt: { type: string, format: date-time }
        newEndsAt: { type: string, format: date-time }
        newStock: { type: integer, minimum: 1 }
    OfferDto:
      type: object
      additionalProperties: true
    ExpireOffersResultDto:
      type: object
      properties:
        expiredCount: { type: integer }
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
