openapi: 3.1.0
info:
  title: "Sensus API — Spec 036 Ciclo de vida de la oferta"
  version: 1.0.0
  description: "Borrador del contrato del spec 036. Completar esquemas antes de implementar."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/offers/{id}/status:
    put:
      summary: "Borrador de PUT /api/v1/offers/{id}/status"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '400': { description: Solicitud inválida }
        '401': { description: No autenticado }
        '404': { description: No encontrado }
  /api/v1/offers/{id}/republish:
    post:
      summary: Republica una oferta expirada o archivada
      operationId: republishOffer
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newStartsAt, newEndsAt, newStock]
              properties:
                newStartsAt: { type: string, format: date-time }
                newEndsAt: { type: string, format: date-time }
                newStock: { type: integer, minimum: 1 }
      responses:
        '200': { description: Oferta republicada en estado Published }
        '400': { description: Fechas inválidas o stock menor a 1 }
        '401': { description: Sin token }
        '403': { description: Sin comercio activo o la oferta es de otro comercio }
        '404': { description: La oferta no existe }
        '409': { description: La oferta no está Expired ni Archived }
  /api/v1/offers/expire-check:
    post:
      summary: Expira las ofertas cuya vigencia terminó
      description: Hoy es público (defecto FR-036-09). Objetivo, solo AdminOnly o invocación interna.
      operationId: triggerOfferExpiration
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Resultado de la ejecución
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiredCount: { type: integer }
                  executedAtUtc: { type: string, format: date-time }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
