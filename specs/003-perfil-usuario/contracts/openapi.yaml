openapi: 3.1.0
info:
  title: "Sensus API — Spec 003 Perfil del usuario autenticado"
  version: 1.2.0
  description: "Contrato de GET/PUT /api/v1/users/profile (validación estricta de foto aprobada en Spec 022) y retiro de POST /api/v1/users/photo-signature (410 Gone)."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/users/profile:
    get:
      summary: "Borrador de GET /api/v1/users/profile"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '400': { description: Solicitud inválida }
        '401': { description: No autenticado }
    put:
      summary: "Borrador de PUT /api/v1/users/profile"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '400': { description: Solicitud inválida }
        '401': { description: No autenticado }
  /api/v1/users/photo-signature:
    post:
      deprecated: true
      summary: "Retirado (410 Gone): usar POST /api/v1/media/upload con moderación previa"
      operationId: generatePhotoSignature
      security: [{ bearerAuth: [] }]
      responses:
        '410':
          description: Endpoint heredado retirado (`Media.SignatureRetired`; usar `POST /api/v1/media/upload`)
        '401':
          description: Sin token
        '403':
          description: Token de invitado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
