openapi: 3.1.0
info:
  title: "Sensus API — Spec 039 Me gusta en publicaciones"
  version: 1.0.0
  description: "Borrador del contrato del spec 039. Completar esquemas antes de implementar."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/feed/posts/{id}/like:
    post:
      summary: Establecer el estado del me gusta sobre una publicación visible
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [liked]
              properties:
                liked:
                  type: boolean
                  description: Estado deseado del me gusta del usuario autenticado.
      responses:
        '200':
          description: Estado resultante y conteo actualizado.
          content:
            application/json:
              schema:
                type: object
                required: [liked, likeCount]
                properties:
                  liked:
                    type: boolean
                  likeCount:
                    type: integer
                    minimum: 0
        '400': { description: Solicitud inválida }
        '401': { description: No autenticado }
        '404': { description: Publicación inexistente o no visible }
        '429': { description: Límite de solicitudes superado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
