openapi: 3.1.0
info:
  title: "Sensus API — Spec 046 Asistente conversacional Sensi"
  version: 1.0.0
  description: "Borrador del contrato del spec 046. Completar esquemas antes de implementar."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/ai/conversations:
    post:
      summary: "Borrador de POST /api/v1/ai/conversations"
      description: "Crea una conversación o devuelve la activa de la persona autenticada."
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Conversación existente }
        '201': { description: Conversación creada }
        '401': { description: No autenticado }
        '403': { description: Sesión invitada }
        '429': { description: Límite de tasa excedido }
  /api/v1/ai/messages:
    post:
      summary: "Borrador de POST /api/v1/ai/messages"
      description: >
        Envía un mensaje con presupuesto y ubicación aproximada. El paquete devuelto se calcula en el
        backend y su total nunca excede el presupuesto declarado.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Respuesta del asistente con paquete opcional }
        '400': { description: Solicitud inválida o presupuesto no interpretable }
        '401': { description: No autenticado }
        '403': { description: Sesión invitada }
        '422': { description: Mensaje rechazado por moderación }
        '429': { description: Límite de tasa o límite diario excedido }
  /api/v1/ai/conversations/{id}:
    get:
      summary: "Borrador de GET /api/v1/ai/conversations/{id}"
      description: "Devuelve el historial paginado de la conversación."
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '401': { description: No autenticado }
        '403': { description: Conversación de otra persona o sesión invitada }
        '404': { description: Conversación inexistente }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
